<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Error Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="error-container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
        Sorry, the page you are looking for doesn't exist or has been moved.
    </p>
    <a href="index.html" class="home-btn">Go Back Home</a>
</div>

</body>
</html>


<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
}

.error-container {
    text-align: center;
    max-width: 500px;
    padding: 40px;
}

.error-container h1 {
    font-size: 120px;
    font-weight: 800;
    letter-spacing: 5px;
}

.error-container h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

.error-container p {
    font-size: 16px;
    color: #dcdcdc;
    margin-bottom: 30px;
    line-height: 1.6;
}

.home-btn {
    text-decoration: none;
    padding: 14px 30px;
    background-color: #00b4d8;
    color: #ffffff;
    border-radius: 6px;
    font-size: 16px;
    transition: background 0.3s ease;
}

.home-btn:hover {
    background-color: #0096c7;
}
</style>
